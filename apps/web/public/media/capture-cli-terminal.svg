    <text x="90" y="332" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  /  +-+-+  \   ##   ## ##   ## #### #### ##       | ##     ## ##      |</text>
    <text x="90" y="358" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal"> |  +|o =|+  |  ####### ######  ## ### ## #####    | ##     ## ####### |</text>
    <text x="90" y="384" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  \  +-+-+  /   ##   ## ##  ##  ##     ## ##       | ##     ##      ## |</text>
    <text x="90" y="410" fill="#1e3a5f" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">   +---v---+    ##   ## ##   ## ##     ## #######  [ ####### ## ####### ]</text>
    <text x="90" y="436" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  Application Security Intelligence &amp; Choke-Point Defense • Cold analytical mode</text>
