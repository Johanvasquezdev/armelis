<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Outer Window Frame -->
  <rect x="30" y="30" width="1140" height="690" rx="14" fill="none" stroke="#1d3d60" stroke-width="2"/>
  
  <!-- Header Bar -->
  <path d="M 30 44 Q 30 30 44 30 L 1156 30 Q 1170 30 1170 44 L 1170 92 L 30 92 Z" fill="#091b2e"/>
  <line x1="30" y1="92" x2="1170" y2="92" stroke="#1d3d60" stroke-width="1.5"/>
  
  <!-- Window Control Buttons -->
  <circle cx="62" cy="61" r="7" fill="#ef4444"/>
  <circle cx="86" cy="61" r="7" fill="#f59e0b"/>
  <circle cx="110" cy="61" r="7" fill="#10b981"/>
  
  <!-- Window Title -->
  <text x="145" y="66" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">ARMELIS SECURITY PLATFORM • HEADLESS CI/CD &amp; TERMINAL CLI</text>
  
  <!-- Badge -->
  <rect x="940" y="47" width="200" height="28" rx="14" fill="rgba(0, 229, 255, 0.1)" stroke="#00e5ff" stroke-width="1"/>
  <text x="1040" y="65" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.06em">PIPELINE AUTOMATION</text>
  
  <!-- Hero Titles -->
  <text x="70" y="150" fill="#f4f8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">Headless CI/CD &amp; Terminal CLI</text>
  <text x="70" y="185" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">3D ASCII Shadow typography, lateral hop tracing and one-line severance calculation</text>
  
  <!-- Content Panel Frame -->
  <rect x="65" y="225" width="1070" height="460" rx="10" fill="url(#panelGrad)" stroke="#1f446c" stroke-width="1.5"/>
  
