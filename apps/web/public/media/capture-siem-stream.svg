<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Outer Window Frame -->
  <rect x="30" y="30" width="1140" height="690" rx="14" fill="none" stroke="#1d3d60" stroke-width="2"/>
  
  <!-- Header Bar -->
  <path d="M 30 44 Q 30 30 44 30 L 1156 30 Q 1170 30 1170 44 L 1170 92 L 30 92 Z" fill="#091b2e"/>
  <line x1="30" y1="92" x2="1170" y2="92" stroke="#1d3d60" stroke-width="1.5"/>
  
  <!-- Window Control Buttons -->
  <circle cx="62" cy="61" r="7" fill="#ef4444"/>
  <circle cx="86" cy="61" r="7" fill="#f59e0b"/>
  <circle cx="110" cy="61" r="7" fill="#10b981"/>
  
  <!-- Window Title -->
  <text x="145" y="66" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">ARMELIS SECURITY PLATFORM • ENTERPRISE SIEM &amp; TELEMETRY PIPELINE</text>
  
  <!-- Badge -->
  <rect x="940" y="47" width="200" height="28" rx="14" fill="rgba(0, 229, 255, 0.1)" stroke="#35d28d" stroke-width="1"/>
  <text x="1040" y="65" fill="#35d28d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.06em">SOC INTEGRATION</text>
  
  <!-- Hero Titles -->
  <text x="70" y="150" fill="#f4f8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">Enterprise SIEM &amp; Telemetry Pipeline</text>
  <text x="70" y="185" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Standardized Common Event Format (CEF), ECS and RFC 5424 Syslog stream</text>
  
  <!-- Content Panel Frame -->
  <rect x="65" y="225" width="1070" height="460" rx="10" fill="url(#panelGrad)" stroke="#1f446c" stroke-width="1.5"/>
  
  <!-- Terminal / Telemetry Lines -->
  <text x="90" y="280" fill="#35d28d" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">&gt; armelis scan . --format cef --stream syslog://soc.internal:514</text>
    <text x="90" y="306" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">CEF:0|Armelis|AppSecEngine|0.1.0|CHOKE_POINT|Single Exposure Isolated|7|</text>
    <text x="90" y="332" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  src=198.51.100.24 dst=10.0.4.15 spt=443 dpt=5432 cs1Label=AttackChain</text>
    <text x="90" y="358" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  cs1=Ingress-&gt;Bypass-&gt;Database cs2Label=ChokePoint cs2=auth/session.go:42</text>
    <text x="90" y="384" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  msg=&apos;Deterministic choke point eliminates 100% of reachability paths&apos;</text>
    <text x="90" y="410" fill="#1e3a5f" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">-----------------------------------------------------------------------------------------</text>
    <text x="90" y="436" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[+] WAZUH (Wazuh Agent):   CONNECTED • Active Rule 100204 Triggered</text>
    <text x="90" y="462" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[+] SPLUNK HEC:            CONNECTED • 200 OK (Event ID 8941204)</text>
    <text x="90" y="488" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[+] ELASTICSEARCH:         CONNECTED • Indexing into appsec-armelis-2026</text>
    <text x="90" y="514" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">[✔] RFC 5424 compliant syslog packet dispatched with zero telemetry leakage</text>
</svg>