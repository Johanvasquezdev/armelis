<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Outer Window Frame -->
  <rect x="30" y="30" width="1140" height="690" rx="14" fill="none" stroke="#1d3d60" stroke-width="2"/>
  
  <!-- Header Bar -->
  <path d="M 30 44 Q 30 30 44 30 L 1156 30 Q 1170 30 1170 44 L 1170 92 L 30 92 Z" fill="#091b2e"/>
  <line x1="30" y1="92" x2="1170" y2="92" stroke="#1d3d60" stroke-width="1.5"/>
  
  <!-- Window Control Buttons -->
  <circle cx="62" cy="61" r="7" fill="#ef4444"/>
  <circle cx="86" cy="61" r="7" fill="#f59e0b"/>
  <circle cx="110" cy="61" r="7" fill="#10b981"/>
  
  <!-- Window Title -->
  <text x="145" y="66" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">ARMELIS SECURITY PLATFORM • GITHUB LIVE REPOSITORY SECURITY ANALYZER</text>
  
  <!-- Badge -->
  <rect x="940" y="47" width="200" height="28" rx="14" fill="rgba(0, 229, 255, 0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="1040" y="65" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.06em">LIVE GITHUB SYNC</text>
  
  <!-- Hero Titles -->
  <text x="70" y="150" fill="#f4f8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">GitHub Live Repository Security Analyzer</text>
  <text x="70" y="185" fill="#8ba2bb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Real-time remote repository ingestion with dynamic mathematical posture scoring</text>
  
  <!-- Content Panel Frame -->
  <rect x="65" y="225" width="1070" height="460" rx="10" fill="url(#panelGrad)" stroke="#1f446c" stroke-width="1.5"/>
  
  <!-- Terminal / Telemetry Lines -->
  <text x="90" y="280" fill="#f59e0b" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">&gt; GET https://api.github.com/repos/Johanvasquezdev/armelis</text>
    <text x="90" y="306" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[+] Ingesting package manifests, AST endpoints, and container configurations</text>
    <text x="90" y="332" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[+] Telemetry: TypeScript • 25 Stars • 4 Forks • MIT License • Zero Cloud Phone-Home</text>
    <text x="90" y="358" fill="#1e3a5f" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">-----------------------------------------------------------------------------------------</text>
    <text x="90" y="384" fill="#34d399" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold">DYNAMIC SECURITY POSTURE SCORE: 99 / 100 [OPTIMAL POSTURE]</text>
    <text x="90" y="410" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  [+] Critical Vulnerabilities: 0</text>
    <text x="90" y="436" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  [+] High Severity CVEs:       0</text>
    <text x="90" y="462" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  [+] Medium Severity Issues:   0</text>
    <text x="90" y="488" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  [+] Verified Defensive Barriers Active: 4 / 4 (Auth, Sanitize, RateLimit, Isolation)</text>
    <text x="90" y="514" fill="#1e3a5f" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">-----------------------------------------------------------------------------------------</text>
    <text x="90" y="540" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">[AI REMEDIATION PROMPT GENERATOR]</text>
    <text x="90" y="566" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  Generated 1-click copy prompts for Cursor, Claude Code, and GitHub Copilot</text>
    <text x="90" y="592" fill="#cbd5e1" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="normal">  Verifiable choke-point patches eliminate guesswork in AI-generated pull requests</text>
</svg>